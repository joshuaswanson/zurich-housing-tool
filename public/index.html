<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zurich housing tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --header-h: 64px;

        --bg: #f5f6f6;
        --surface: #ffffff;
        --ink: #171a1e;
        --muted: #636b74;
        --line: #dcdfe3;
        --line-soft: #eceef0;
        --row-hover: #eef2f8;
        --accent: #1f4fa3;
        --accent-ink: #ffffff;
        --danger: #b3261e;

        --src-flatfox: #0b7f86;
        --src-wgzimmer: #c2600f;
        --src-ronorp: #7b4bb3;

        --map-land: #eef0ee;
        --map-water: #c5d7e6;
        --map-green: #dbe6d6;
        --map-road: #ffffff;
        --map-road-minor: #f8f9f8;
        --map-rail: #cfd3d6;
        --map-label: #5c646d;
        --map-control-filter: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181c;
          --surface: #1c2025;
          --ink: #e7e9eb;
          --muted: #939ba4;
          --line: #2e333a;
          --line-soft: #24282e;
          --row-hover: #222831;
          --accent: #8ab4f0;
          --accent-ink: #10203a;
          --danger: #f08a80;

          --src-flatfox: #3fbfc4;
          --src-wgzimmer: #f0994a;
          --src-ronorp: #b592e8;

          --map-land: #1b1e23;
          --map-water: #0e2233;
          --map-green: #1c2b22;
          --map-road: #3d444d;
          --map-road-minor: #2b3037;
          --map-rail: #2f353c;
          --map-label: #99a1aa;
          --map-control-filter: invert(1);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .button:hover:not(:disabled) {
        border-color: var(--muted);
      }

      .button:disabled {
        color: var(--muted);
        cursor: progress;
      }

      .button-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        padding: 8px 14px;
      }

      .button-primary:hover:not(:disabled) {
        border-color: var(--accent);
        filter: brightness(1.1);
      }

      .button-primary:disabled {
        color: var(--accent-ink);
        opacity: 0.6;
      }

      .button-danger {
        color: var(--danger);
      }

      /* Header */

      .page-header {
        height: var(--header-h);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
        font-size: 25px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.045em;
        white-space: nowrap;
        padding-top: 0.12em;
      }

      .logo-mark {
        width: 28px;
        height: 28px;
        flex: none;
        margin-top: -0.12em;
      }

      .logo-mark-light {
        fill: var(--surface);
      }

      .logo-mark-blue {
        fill: var(--accent);
      }

      .logo-mark-outline {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linejoin: round;
      }

      .logo-u {
        position: relative;
        display: inline-block;
      }

      .logo-u i {
        position: absolute;
        top: 0.07em;
        width: 0.17em;
        height: 0.17em;
        border-radius: 50%;
      }

      .logo-u i:first-child {
        left: 0.1em;
        background: var(--src-wgzimmer);
      }

      .logo-u i:last-child {
        right: 0.1em;
        background: var(--src-flatfox);
      }

      .logo-rest {
        margin-left: 0.22em;
        color: var(--muted);
      }

      .summary {
        color: var(--muted);
        flex: 1;
        min-width: 0;
      }

      .header-link {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .header-link:hover {
        color: var(--ink);
      }

      .scan {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .scan-status {
        color: var(--muted);
        font-size: 13px;
      }

      .scan-status.is-error {
        color: var(--danger);
      }

      /* Layout */

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 46fr) minmax(0, 54fr);
        height: calc(100dvh - var(--header-h));
      }

      .map-pane {
        position: relative;
        border-right: 1px solid var(--line);
        background: var(--map-land);
      }

      #map {
        position: absolute;
        inset: 0;
      }

      .content {
        overflow-y: auto;
        padding: 20px 24px 32px;
      }

      /* Map */

      .legend {
        position: absolute;
        left: 12px;
        top: 12px;
        display: flex;
        gap: 14px;
        padding: 6px 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12.5px;
      }

      .source {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }

      .dot-flatfox {
        background: var(--src-flatfox);
      }

      .dot-wgzimmer {
        background: var(--src-wgzimmer);
      }

      .dot-ronorp {
        background: var(--src-ronorp);
      }

      .dot-target {
        background: var(--surface);
        border: 3px solid var(--accent);
      }

      .target-pin {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--surface);
        border: 4px solid var(--accent);
        cursor: pointer;
      }

      .maplibregl-map {
        font: inherit;
      }

      .maplibregl-ctrl-group,
      .maplibregl-ctrl.maplibregl-ctrl-attrib {
        background: var(--surface);
        color: var(--muted);
      }

      .maplibregl-ctrl-group:not(:empty) {
        box-shadow: 0 0 0 1px var(--line);
      }

      .maplibregl-ctrl-group button + button {
        border-top-color: var(--line);
      }

      .maplibregl-ctrl button .maplibregl-ctrl-icon,
      .maplibregl-ctrl-attrib-button {
        filter: var(--map-control-filter);
      }

      .maplibregl-ctrl-attrib a {
        color: var(--muted);
      }

      .maplibregl-popup-content {
        background: var(--surface);
        color: var(--ink);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      }

      .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
        border-top-color: var(--surface);
      }

      .maplibregl-popup-anchor-top .maplibregl-popup-tip {
        border-bottom-color: var(--surface);
      }

      .maplibregl-popup-anchor-left .maplibregl-popup-tip {
        border-right-color: var(--surface);
      }

      .maplibregl-popup-anchor-right .maplibregl-popup-tip {
        border-left-color: var(--surface);
      }

      .maplibregl-popup-close-button {
        color: var(--muted);
      }

      .popup-rent {
        font-weight: 600;
      }

      .popup-place {
        color: var(--muted);
        margin: 2px 0 6px;
      }

      /* Filters */

      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .filter-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        flex-basis: 100%;
      }

      .filter-group-label {
        color: var(--muted);
      }

      .filter-group .filter {
        gap: 6px;
      }

      .filter {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .filter input[type="range"] {
        width: 130px;
        accent-color: var(--accent);
      }

      .filter input[role="switch"] {
        appearance: none;
        position: relative;
        flex: none;
        width: 30px;
        height: 18px;
        border-radius: 9px;
        background: var(--line);
        cursor: pointer;
        transition: background 0.15s;
      }

      .filter input[role="switch"]::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--muted);
        transition: transform 0.15s;
      }

      .filter input[role="switch"]:checked {
        background: var(--accent);
      }

      .filter input[role="switch"]:checked::before {
        transform: translateX(12px);
        box-shadow: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .filter input[role="switch"],
        .filter input[role="switch"]::before {
          transition: none;
        }
      }

      .filter output {
        font-weight: 500;
        min-width: 4.5em;
      }

      /* Sections */

      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
      }

      .tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        padding: 4px 0 10px;
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }

      .tab:hover {
        color: var(--ink);
      }

      .tab[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }

      .tab-count {
        margin-left: 4px;
        font-weight: 400;
        color: var(--muted);
      }

      .tab-panel {
        padding-top: 16px;
      }

      .section-note {
        color: var(--muted);
        font-size: 13px;
        margin: 14px 0 6px;
      }

      .section-note:empty {
        display: none;
      }

      /* Listings table */

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        padding: 8px 12px 8px 0;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      .sort-button {
        background: none;
        border: none;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
      }

      .sort-button:hover {
        color: var(--ink);
      }

      th[aria-sort="ascending"] .sort-button {
        color: var(--ink);
      }

      th[aria-sort="ascending"] .sort-button::after {
        content: " \2191";
      }

      td {
        padding: 10px 12px 10px 0;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: top;
      }

      th:first-child,
      td:first-child {
        padding-left: 8px;
      }

      tbody tr.listing-row {
        cursor: pointer;
      }

      tbody tr.is-active td {
        border-bottom-color: transparent;
      }

      tbody tr.is-active .description {
        display: block;
        max-width: 60ch;
      }

      tbody tr.detail-row {
        background: var(--row-hover);
      }

      tbody tr.detail-row td {
        padding: 2px 8px 12px;
      }

      .group-head {
        margin: 18px 0 2px;
        padding: 0 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .group-head:first-child {
        margin-top: 4px;
      }

      tbody tr:hover,
      tbody tr.is-active {
        background: var(--row-hover);
      }

      .rent {
        font-weight: 600;
        white-space: nowrap;
      }

      .nowrap {
        white-space: nowrap;
      }

      .secondary {
        color: var(--muted);
        font-size: 12.5px;
      }

      .status {
        margin-left: 6px;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        font-size: 12px;
        text-transform: capitalize;
      }

      .available {
        min-width: 9ch;
        max-width: 20ch;
      }

      .table-scroll {
        overflow-x: auto;
      }

      .description {
        color: var(--muted);
        font-size: 12.5px;
        max-width: 46ch;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .row-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }

      .empty {
        padding: 40px 8px;
        color: var(--muted);
      }

      /* Applications */

      .application {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 16px;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line-soft);
      }

      .application-place {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Message dialog */

      dialog {
        margin: auto;
        width: min(680px, calc(100vw - 32px));
        max-height: 80dvh;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }

      dialog h2 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      dialog pre {
        font: inherit;
        white-space: pre-wrap;
        max-height: 56dvh;
        overflow-y: auto;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      .page-footer {
        margin-top: 32px;
        font-size: 12.5px;
      }

      @media (max-width: 900px) {
        .page-header {
          height: auto;
          padding: 12px 16px;
          flex-wrap: wrap;
          gap: 8px 16px;
        }

        .logo {
          font-size: 21px;
        }

        .summary,
        .header-link {
          order: 3;
        }

        .summary {
          flex-basis: 60%;
        }

        .scan {
          margin-left: auto;
        }

        .layout {
          display: block;
          height: auto;
        }

        .map-pane {
          height: 50dvh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .content {
          overflow: visible;
          padding: 16px;
        }

        .application {
          grid-template-columns: minmax(0, 1fr) auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <h1 class="logo" aria-label="Zurich housing tool">
        <svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true">
          <defs>
            <clipPath id="logo-house">
              <path d="M2 12.5 14 2l12 10.5V26H2Z" />
            </clipPath>
          </defs>
          <g clip-path="url(#logo-house)">
            <rect class="logo-mark-light" width="28" height="28" />
            <path class="logo-mark-blue" d="M0 0 28 28H0Z" />
          </g>
          <path class="logo-mark-outline" d="M2 12.5 14 2l12 10.5V26H2Z" />
        </svg>
        <span class="logo-text" aria-hidden="true"
          >z<span class="logo-u">u<i></i><i></i></span>rich<span
            class="logo-rest"
            >housing tool</span
          ></span
        >
      </h1>
      <p class="summary">by Joshua Swanson</p>
      <a
        class="header-link"
        href="https://github.com/joshuaswanson/zurich-housing-tool/issues"
        target="_blank"
        rel="noopener"
        >Report an issue</a
      >
      <div class="scan">
        <span class="scan-status" id="scan-status" role="status"></span>
        <button class="button button-primary" id="scan-button">
          Scan for listings
        </button>
      </div>
    </header>

    <div class="layout">
      <section class="map-pane" aria-label="Map of listings">
        <div id="map"></div>
        <div class="legend">
          <span class="source"
            ><i class="dot dot-target"></i
            ><span id="legend-target">Target</span></span
          >
          <span class="source"><i class="dot dot-wgzimmer"></i>wgzimmer</span>
          <span class="source"><i class="dot dot-flatfox"></i>flatfox</span>
          <span class="source"><i class="dot dot-ronorp"></i>ronorp</span>
        </div>
      </section>

      <main class="content">
        <div class="tabs" role="tablist">
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-listings"
            aria-controls="panel-listings"
            aria-selected="true"
          >
            Listings <span class="tab-count" id="tab-listings-count"></span>
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            id="tab-applications"
            aria-controls="panel-applications"
            aria-selected="false"
            tabindex="-1"
          >
            Applications
            <span class="tab-count" id="tab-applications-count"></span>
          </button>
        </div>

        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-listings"
          aria-labelledby="tab-listings"
        >
        <form class="filters" id="filters">
          <label class="filter">
            Max rent
            <input
              type="range"
              id="f-price"
              min="500"
              max="3000"
              step="50"
              value="2000"
            />
            <output id="f-price-val"></output>
          </label>
          <label class="filter">
            Max distance
            <input
              type="range"
              id="f-dist"
              min="0.5"
              max="5"
              step="0.1"
              value="5"
            />
            <output id="f-dist-val"></output>
          </label>
          <div class="filter-group" role="group" aria-label="Show">
            <span class="filter-group-label">Show</span>
            <label class="filter">
              <input type="checkbox" role="switch" id="f-tracked" />
              Tracked
            </label>
            <label class="filter">
              <input type="checkbox" role="switch" id="f-gender" />
              Gender-restricted
            </label>
            <label class="filter">
              <input type="checkbox" role="switch" id="f-student" />
              WOKO and JUWO
            </label>
            <label class="filter">
              <input type="checkbox" role="switch" id="f-short" />
              Short sublets
            </label>
            <label class="filter">
              <input type="checkbox" role="switch" id="f-bulk" />
              Bulk posters
            </label>
          </div>
          <label class="filter">
            <input type="checkbox" role="switch" id="f-new" />
            Only new in the last 24 hours
          </label>
        </form>

        <p class="section-note" id="listings-note"></p>
        <div class="table-scroll">
          <table id="listings-table">
            <thead>
              <tr>
                <th data-sort="price" aria-sort="ascending">
                  <button class="sort-button" type="button">Rent (CHF)</button>
                </th>
                <th data-sort="distance">
                  <button class="sort-button" type="button">Distance</button>
                </th>
                <th>Address</th>
                <th>Available</th>
                <th>Source</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listings-body"></tbody>
          </table>
        </div>
        <p class="empty" id="listings-empty" hidden></p>

        </section>

        <section
          class="tab-panel"
          role="tabpanel"
          id="panel-applications"
          aria-labelledby="tab-applications"
          hidden
        >
        <div id="applied-list"></div>
        </section>

        <footer class="page-footer">
          <a
            href="https://github.com/joshuaswanson/zurich-housing-tool"
            target="_blank"
            >github.com/joshuaswanson/zurich-housing-tool</a
          >
        </footer>
      </main>
    </div>

    <dialog id="message-dialog">
      <h2 id="dialog-title"></h2>
      <pre id="dialog-body"></pre>
      <div class="dialog-actions">
        <button class="button" id="dialog-copy" type="button">
          Copy message
        </button>
        <form method="dialog">
          <button class="button">Close</button>
        </form>
      </div>
    </dialog>

    <script>
      const MAX_ROWS = 200;
      const SOURCES_LABEL = "wgzimmer.ch, flatfox.ch and ronorp.net";

      let target = { lat: 47.3764, lng: 8.5483, label: "ETH Zentrum" };
      let allListings = [];
      let tracker = { applied: [], excluded: [], rejected: [], shortlisted: [] };
      let appMessages = [];
      let sortBy = "price";
      const trackedStatus = new Map();
      const NEW_WINDOW_MS = 24 * 60 * 60 * 1000;
      const SHOW_FILTERS = {
        "f-gender": "genderRestricted",
        "f-student": "studentHousing",
        "f-short": "shortSublet",
        "f-bulk": "bulkPoster",
      };
      const CHECKBOX_FILTERS = ["f-tracked", "f-new", ...Object.keys(SHOW_FILTERS)];

      // Tracker entries and listings can use different URLs for one listing,
      // so they are matched on the wgzimmer UUID or the flatfox number.
      function listingKey(url) {
        return (
          url.match(
            /([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/,
          )?.[1] ||
          url.match(/\/(\d{5,})\/?$/)?.[1] ||
          url
        );
      }

      function statusOf(url) {
        return trackedStatus.get(listingKey(url));
      }

      function isNew(l) {
        return (
          !l.firstSeen ||
          Date.now() - new Date(l.firstSeen).getTime() < NEW_WINDOW_MS
        );
      }
      const FILTERS_KEY = "zurich-housing-filters-2";

      const $ = (id) => document.getElementById(id);

      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function plural(n, word) {
        return `${n} ${word}${n === 1 ? "" : "s"}`;
      }

      async function load() {
        try {
          const [listRes, trackRes] = await Promise.all([
            fetch("/api/listings"),
            fetch("/api/tracker"),
          ]);
          allListings = await listRes.json();
          tracker = await trackRes.json();
        } catch (e) {
          showEmpty("Could not load listings. Check that the server is running.");
          return;
        }

        trackedStatus.clear();
        for (const cat of ["shortlisted", "excluded", "rejected", "applied"]) {
          for (const e of tracker[cat] || []) {
            trackedStatus.set(listingKey(e.url), cat);
          }
        }

        // A price below 50 is a parsing error in the scraped listing.
        allListings = allListings.filter((l) => l.price >= 50);

        applyFilters();
        renderApplications();
      }

      function applyFilters() {
        const maxPrice = parseInt($("f-price").value);
        const maxDist = parseFloat($("f-dist").value);
        const checked = Object.fromEntries(
          CHECKBOX_FILTERS.map((id) => [id, $(id).checked]),
        );

        localStorage.setItem(
          FILTERS_KEY,
          JSON.stringify({ maxPrice, maxDist, checked, sortBy }),
        );

        $("f-price-val").textContent = `CHF ${maxPrice}`;
        $("f-dist-val").textContent = `${maxDist} km`;

        const filtered = allListings.filter((l) => {
          if (l.price > maxPrice) return false;
          if (l.dist !== null && l.dist > maxDist) return false;
          if (!checked["f-tracked"] && statusOf(l.url)) return false;
          if (checked["f-new"] && !isNew(l)) return false;
          for (const [id, flag] of Object.entries(SHOW_FILTERS)) {
            if (!checked[id] && l[flag]) return false;
          }
          return true;
        });

        if (sortBy === "price") {
          filtered.sort((a, b) => a.price - b.price);
        } else {
          filtered.sort((a, b) => (a.dist ?? 999) - (b.dist ?? 999));
        }

        $("tab-listings-count").textContent = filtered.length;
        renderTable(filtered);
        setMapListings(filtered);
      }

      function selectTab(tab) {
        document.querySelectorAll(".tab").forEach((other) => {
          const selected = other === tab;
          other.setAttribute("aria-selected", selected);
          other.tabIndex = selected ? 0 : -1;
          $(other.getAttribute("aria-controls")).hidden = !selected;
        });
      }

      function showEmpty(text) {
        $("listings-body").innerHTML = "";
        $("listings-table").hidden = true;
        $("listings-empty").hidden = false;
        $("listings-empty").textContent = text;
        $("listings-note").textContent = "";
      }

      function renderTable(listings) {
        if (allListings.length === 0) {
          showEmpty(
            `No listings yet. Scan to fetch them from ${SOURCES_LABEL}.`,
          );
          return;
        }
        if (listings.length === 0) {
          showEmpty("No listings match these filters.");
          return;
        }

        $("listings-table").hidden = false;
        $("listings-empty").hidden = true;

        const unmapped = listings.filter((l) => !l.lat || !l.lng).length;
        const notes = [
          listings.length > MAX_ROWS
            ? `Showing the first ${MAX_ROWS} of ${listings.length}`
            : `${listings.length} of ${allListings.length}`,
        ];
        if (unmapped > 0) {
          notes.push(`${unmapped} without coordinates are not on the map`);
        }
        $("listings-note").textContent = notes.join(". ");

        $("listings-body").innerHTML = listings
          .slice(0, MAX_ROWS)
          .map(
            (l) => `
              <tr class="listing-row" data-id="${esc(l.id)}">
                <td class="rent">${esc(l.price)}</td>
                <td class="nowrap">${l.dist !== null ? l.dist.toFixed(1) + " km" : ""}</td>
                <td>
                  <div>
                    ${esc(l.address || "Address not fetched")}
                    ${statusOf(l.url) ? `<span class="status">${statusOf(l.url)}</span>` : ""}
                  </div>
                  ${summary(l) ? `<div class="description">${esc(summary(l))}</div>` : ""}
                </td>
                <td class="available">
                  <div>${esc(l.availableFrom || "")}</div>
                  ${endDate(l) ? `<div class="secondary">until ${esc(endDate(l))}</div>` : ""}
                </td>
                <td><span class="source"><i class="dot dot-${esc(l.source)}"></i>${esc(l.source)}</span></td>
                <td>
                  <div class="row-actions">
                    <a href="${esc(l.url)}" target="_blank" rel="noopener">Open</a>
                  </div>
                </td>
              </tr>`,
          )
          .join("");
      }

      function endDate(l) {
        return /no time restriction/i.test(l.until || "") ? "" : l.until;
      }

      // wgzimmer descriptions are pipe-separated fields. Only the free-text
      // fields are shown, since the rest repeat other columns.
      function summary(l) {
        if (l.source !== "wgzimmer") return l.description;
        return l.description
          .split(" | ")
          .map((part) => part.trim())
          .filter(
            (part) =>
              part &&
              part !== l.address &&
              !/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(part) &&
              !/^[\d,.']+$/.test(part) &&
              !/^until:/i.test(part) &&
              !/^zürich \(stadt\)$/i.test(part),
          )
          .join(", ");
      }

      function daysAgo(date) {
        if (!date) return "";
        const days = Math.floor(
          (Date.now() - new Date(date).getTime()) / 86400000,
        );
        if (days <= 0) return "today";
        return `${plural(days, "day")} ago`;
      }

      const TRACKED_GROUPS = [
        ["applied", "Applied"],
        ["shortlisted", "Shortlisted"],
        ["rejected", "Rejected"],
        ["excluded", "Excluded"],
      ];
      const TRACKED_ACTIONS = {
        applied: [
          ["show-message", "Show message"],
          ["reject", "Mark rejected"],
          ["untrack", "Remove"],
        ],
        shortlisted: [
          ["apply", "Mark applied"],
          ["untrack", "Remove"],
        ],
        rejected: [["untrack", "Remove"]],
        excluded: [["untrack", "Restore"]],
      };

      function actionButtons(actions) {
        return actions
          .map(
            ([action, label]) =>
              `<button class="button" type="button" data-action="${action}">${label}</button>`,
          )
          .join("");
      }

      function renderApplications() {
        $("tab-applications-count").textContent = (tracker.applied || []).length;

        const groups = TRACKED_GROUPS.filter(
          ([category]) => (tracker[category] || []).length > 0,
        );
        if (groups.length === 0) {
          $("applied-list").innerHTML =
            '<p class="empty">Nothing tracked yet. Select a listing to shortlist it or mark it as applied.</p>';
          return;
        }

        $("applied-list").innerHTML = groups
          .map(
            ([category, label]) => `
              <h3 class="group-head">${label} <span class="tab-count">${tracker[category].length}</span></h3>
              ${tracker[category]
                .map(
                  (e) => `
                    <div class="application" data-url="${esc(e.url)}">
                      <a class="application-place" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.address || e.url.substring(0, 60))}</a>
                      <span class="rent">${e.price ? "CHF " + esc(e.price) : ""}</span>
                      <span class="secondary">${esc(e.reason || daysAgo(e.date))}</span>
                      <span class="row-actions">${actionButtons(TRACKED_ACTIONS[category])}</span>
                    </div>`,
                )
                .join("")}`,
          )
          .join("");
      }

      function detailRow(l) {
        const status = statusOf(l.url);
        const actions = [["draft", "Draft message"]];
        if (status !== "applied") actions.push(["apply", "Mark applied"]);
        if (!status) {
          actions.push(["shortlist", "Shortlist"], ["exclude", "Exclude"]);
        } else {
          actions.push(["untrack", "Stop tracking"]);
        }
        const row = document.createElement("tr");
        row.className = "detail-row";
        row.dataset.url = l.url;
        row.innerHTML = `<td colspan="6"><div class="row-actions">${actionButtons(actions)}</div></td>`;
        return row;
      }

      function selectListing(id) {
        const listing = allListings.find((l) => l.id === id);
        const row = focusRow(id);
        document.querySelector("#listings-body .detail-row")?.remove();
        if (!listing || !row) return;
        row.after(detailRow(listing));
        flyToListing(id);
      }

      async function track(url, action) {
        const listing = allListings.find(
          (l) => listingKey(l.url) === listingKey(url),
        );
        await fetch("/api/track", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url,
            action,
            address: listing?.address,
            price: listing?.price,
          }),
        });
        await load();
      }

            // Scan

      async function scan() {
        const button = $("scan-button");
        const status = $("scan-status");
        button.disabled = true;
        button.textContent = "Scanning";
        status.classList.remove("is-error");
        status.textContent = "This takes a few minutes.";

        try {
          const res = await fetch("/api/scan", { method: "POST" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          await load();
          status.textContent = "Scan finished.";
        } catch (e) {
          status.classList.add("is-error");
          status.textContent = `Scan failed. ${e.message}`;
        }

        button.disabled = false;
        button.textContent = "Scan for listings";
      }

      // Messages

      function openDialog(title, body, { copyable = false } = {}) {
        $("dialog-title").textContent = title;
        $("dialog-body").textContent = body;
        $("dialog-copy").hidden = !copyable;
        $("dialog-copy").textContent = "Copy message";
        $("message-dialog").showModal();
      }

      async function loadMessages() {
        try {
          const res = await fetch("/api/applications");
          appMessages = await res.json();
        } catch {}
      }

      function showMessage(url) {
        const match = appMessages.find(
          (a) => a.content.includes(url) || url.includes(a.id.split("-")[0]),
        );
        openDialog(
          "Sent message",
          match ? match.content : "No saved message for this listing.",
        );
      }

      async function draftMessage(url, button) {
        button.disabled = true;
        button.textContent = "Drafting";
        try {
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            openDialog("Could not draft a message", data.error);
          } else {
            openDialog("Application message", data.message, { copyable: true });
          }
        } catch (e) {
          openDialog("Could not draft a message", e.message);
        } finally {
          button.disabled = false;
          button.textContent = "Draft message";
        }
      }

      // Map

      const RING_KM = [0.5, 1, 1.5];
      let map;
      let listingsGeojson = { type: "FeatureCollection", features: [] };
      let hoveredId = null;

      function cssVar(name) {
        return getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();
      }

      function ringFeatures() {
        const kmPerDegLat = 111.32;
        const kmPerDegLng = kmPerDegLat * Math.cos((target.lat * Math.PI) / 180);
        const features = [];
        for (const km of RING_KM) {
          const coordinates = [];
          for (let i = 0; i <= 96; i++) {
            const a = (i / 96) * 2 * Math.PI;
            coordinates.push([
              target.lng + (km * Math.sin(a)) / kmPerDegLng,
              target.lat + (km * Math.cos(a)) / kmPerDegLat,
            ]);
          }
          features.push({
            type: "Feature",
            geometry: { type: "LineString", coordinates },
            properties: {},
          });
          features.push({
            type: "Feature",
            geometry: { type: "Point", coordinates: coordinates[0] },
            properties: { label: km < 1 ? `${km * 1000} m` : `${km} km` },
          });
        }
        return { type: "FeatureCollection", features };
      }

      function buildMapStyle() {
        const land = cssVar("--map-land");
        const label = cssVar("--map-label");
        const accent = cssVar("--accent");
        const isLine = [
          "match",
          ["geometry-type"],
          ["LineString", "MultiLineString"],
          true,
          false,
        ];
        const placeLabel = (id, classes, minzoom, font, size) => ({
          id,
          type: "symbol",
          source: "basemap",
          "source-layer": "place",
          minzoom,
          filter: ["match", ["get", "class"], classes, true, false],
          layout: {
            "text-field": ["get", "name"],
            "text-font": [font],
            "text-size": size,
            "text-max-width": 8,
          },
          paint: {
            "text-color": label,
            "text-halo-color": land,
            "text-halo-width": 1.5,
          },
        });

        return {
          version: 8,
          glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
          sources: {
            basemap: {
              type: "vector",
              url: "https://tiles.openfreemap.org/planet",
            },
            rings: { type: "geojson", data: ringFeatures() },
            listings: {
              type: "geojson",
              data: listingsGeojson,
              promoteId: "id",
            },
          },
          layers: [
            {
              id: "land",
              type: "background",
              paint: { "background-color": land },
            },
            {
              id: "wood",
              type: "fill",
              source: "basemap",
              "source-layer": "landcover",
              filter: ["==", ["get", "class"], "wood"],
              paint: { "fill-color": cssVar("--map-green") },
            },
            {
              id: "park",
              type: "fill",
              source: "basemap",
              "source-layer": "park",
              paint: { "fill-color": cssVar("--map-green") },
            },
            {
              id: "water",
              type: "fill",
              source: "basemap",
              "source-layer": "water",
              paint: { "fill-color": cssVar("--map-water") },
            },
            {
              id: "river",
              type: "line",
              source: "basemap",
              "source-layer": "waterway",
              filter: ["==", ["get", "class"], "river"],
              paint: { "line-color": cssVar("--map-water"), "line-width": 2 },
            },
            {
              id: "rail",
              type: "line",
              source: "basemap",
              "source-layer": "transportation",
              minzoom: 12,
              filter: [
                "all",
                isLine,
                ["==", ["get", "class"], "rail"],
                ["!", ["has", "service"]],
              ],
              paint: { "line-color": cssVar("--map-rail"), "line-width": 1 },
            },
            {
              id: "road-minor",
              type: "line",
              source: "basemap",
              "source-layer": "transportation",
              minzoom: 14,
              filter: ["all", isLine, ["==", ["get", "class"], "minor"]],
              layout: { "line-cap": "round", "line-join": "round" },
              paint: {
                "line-color": cssVar("--map-road-minor"),
                "line-width": [
                  "interpolate",
                  ["exponential", 1.5],
                  ["zoom"],
                  14,
                  0.8,
                  18,
                  7,
                ],
              },
            },
            {
              id: "road-major",
              type: "line",
              source: "basemap",
              "source-layer": "transportation",
              filter: [
                "all",
                isLine,
                [
                  "match",
                  ["get", "class"],
                  ["motorway", "trunk", "primary", "secondary", "tertiary"],
                  true,
                  false,
                ],
                ["!=", ["get", "brunnel"], "tunnel"],
              ],
              layout: { "line-cap": "round", "line-join": "round" },
              paint: {
                "line-color": cssVar("--map-road"),
                "line-width": [
                  "interpolate",
                  ["exponential", 1.4],
                  ["zoom"],
                  10,
                  0.6,
                  14,
                  2.5,
                  18,
                  14,
                ],
              },
            },
            placeLabel(
              "label-district",
              ["suburb", "quarter", "neighbourhood"],
              12.5,
              "Noto Sans Regular",
              11.5,
            ),
            placeLabel(
              "label-town",
              ["city", "town", "village"],
              0,
              "Noto Sans Bold",
              13,
            ),
            {
              id: "ring",
              type: "line",
              source: "rings",
              filter: ["==", ["geometry-type"], "LineString"],
              paint: {
                "line-color": accent,
                "line-opacity": 0.45,
                "line-width": 1,
                "line-dasharray": [3, 3],
              },
            },
            {
              id: "ring-label",
              type: "symbol",
              source: "rings",
              filter: ["==", ["geometry-type"], "Point"],
              layout: {
                "text-field": ["get", "label"],
                "text-font": ["Noto Sans Regular"],
                "text-size": 11,
                "text-allow-overlap": true,
              },
              paint: {
                "text-color": accent,
                "text-halo-color": land,
                "text-halo-width": 2,
              },
            },
            {
              id: "listing",
              type: "circle",
              source: "listings",
              paint: {
                "circle-radius": [
                  "case",
                  ["boolean", ["feature-state", "hover"], false],
                  9,
                  5.5,
                ],
                "circle-color": [
                  "match",
                  ["get", "source"],
                  "flatfox",
                  cssVar("--src-flatfox"),
                  "wgzimmer",
                  cssVar("--src-wgzimmer"),
                  cssVar("--src-ronorp"),
                ],
                "circle-stroke-color": cssVar("--surface"),
                "circle-stroke-width": 1.5,
              },
            },
          ],
        };
      }

      function setMapListings(listings) {
        listingsGeojson = {
          type: "FeatureCollection",
          features: listings
            .filter((l) => l.lat && l.lng)
            .map((l) => ({
              type: "Feature",
              geometry: { type: "Point", coordinates: [l.lng, l.lat] },
              properties: {
                id: l.id,
                source: l.source,
                price: l.price,
                place: l.address || l.source,
                url: l.url,
              },
            })),
        };
        hoveredId = null;
        map?.getSource("listings")?.setData(listingsGeojson);
      }

      function setHovered(id) {
        if (!map?.getSource("listings")) return;
        if (hoveredId !== null) {
          map.setFeatureState(
            { source: "listings", id: hoveredId },
            { hover: false },
          );
        }
        hoveredId = id;
        if (id !== null) {
          map.setFeatureState({ source: "listings", id }, { hover: true });
        }
      }

      function listingPopup(properties) {
        const node = document.createElement("div");
        const rent = document.createElement("div");
        rent.className = "popup-rent";
        rent.textContent = `CHF ${properties.price}`;
        const place = document.createElement("div");
        place.className = "popup-place";
        place.textContent = properties.place;
        const link = document.createElement("a");
        link.href = properties.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Open listing";
        node.append(rent, place, link);
        return node;
      }

      let listingPopupOnMap = null;

      function showListingPopup(lngLat, properties) {
        listingPopupOnMap?.remove();
        listingPopupOnMap = new maplibregl.Popup({
          offset: 10,
          focusAfterOpen: false,
        })
          .setLngLat(lngLat)
          .setDOMContent(listingPopup(properties))
          .addTo(map);
      }

      function flyToListing(id) {
        const feature = listingsGeojson.features.find(
          (f) => f.properties.id === id,
        );
        if (!feature) return;
        showListingPopup(feature.geometry.coordinates, feature.properties);
        map.flyTo({
          center: feature.geometry.coordinates,
          zoom: Math.max(map.getZoom(), 15.5),
          speed: 1.4,
        });
        if (matchMedia("(max-width: 900px)").matches) {
          $("map").scrollIntoView({ block: "start", behavior: "smooth" });
        }
      }

      function focusRow(id, { scroll = false } = {}) {
        document
          .querySelectorAll("#listings-body tr.is-active")
          .forEach((tr) => tr.classList.remove("is-active"));
        const row = [...document.querySelectorAll("#listings-body tr")].find(
          (tr) => tr.dataset.id === id,
        );
        if (!row) return null;
        row.classList.add("is-active");
        if (scroll) row.scrollIntoView({ block: "center", behavior: "smooth" });
        return row;
      }

      function initMap() {
        map = new maplibregl.Map({
          container: "map",
          style: buildMapStyle(),
          center: [target.lng, target.lat],
          zoom: 13.5,
          minZoom: 11,
          maxZoom: 18,
          maxBounds: [
            [8.38, 47.29],
            [8.68, 47.46],
          ],
          dragRotate: false,
          pitchWithRotate: false,
          attributionControl: false,
        });
        map.touchZoomRotate.disableRotation();
        map.addControl(
          new maplibregl.NavigationControl({ showCompass: false }),
          "top-right",
        );
        map.addControl(
          new maplibregl.AttributionControl({ compact: true }),
          "bottom-right",
        );

        const pin = document.createElement("div");
        pin.className = "target-pin";
        new maplibregl.Marker({ element: pin })
          .setLngLat([target.lng, target.lat])
          .setPopup(new maplibregl.Popup({ offset: 14 }).setText(target.label))
          .addTo(map);

        map.on("style.load", () => {
          map.getSource("listings").setData(listingsGeojson);
        });

        map.on("mouseenter", "listing", () => {
          map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", "listing", () => {
          map.getCanvas().style.cursor = "";
        });
        map.on("click", "listing", (e) => {
          const feature = e.features[0];
          showListingPopup(feature.geometry.coordinates, feature.properties);
          document.querySelector("#listings-body .detail-row")?.remove();
          const row = focusRow(feature.properties.id, { scroll: true });
          const listing = allListings.find(
            (l) => l.id === feature.properties.id,
          );
          if (row && listing) row.after(detailRow(listing));
        });

        matchMedia("(prefers-color-scheme: dark)").addEventListener(
          "change",
          () => map.setStyle(buildMapStyle()),
        );
      }

      // Events

      $("scan-button").addEventListener("click", scan);

      document.querySelectorAll(".tab").forEach((tab, index, tabs) => {
        tab.addEventListener("click", () => selectTab(tab));
        tab.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          const step = e.key === "ArrowRight" ? 1 : -1;
          const next = tabs[(index + step + tabs.length) % tabs.length];
          selectTab(next);
          next.focus();
        });
      });
      $("filters").addEventListener("input", applyFilters);
      $("filters").addEventListener("submit", (e) => e.preventDefault());

      function setSort(column) {
        sortBy = column;
        document.querySelectorAll("th[data-sort]").forEach((th) => {
          if (th.dataset.sort === column) {
            th.setAttribute("aria-sort", "ascending");
          } else {
            th.removeAttribute("aria-sort");
          }
        });
      }

      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.querySelector("button").addEventListener("click", () => {
          setSort(th.dataset.sort);
          applyFilters();
        });
      });

      function restoreFilters() {
        let saved;
        try {
          saved = JSON.parse(localStorage.getItem(FILTERS_KEY));
        } catch {}
        if (!saved) return;
        $("f-price").value = saved.maxPrice;
        $("f-dist").value = saved.maxDist;
        for (const [id, value] of Object.entries(saved.checked || {})) {
          if ($(id)) $(id).checked = value;
        }
        setSort(saved.sortBy === "distance" ? "distance" : "price");
      }

      $("listings-body").addEventListener("click", (e) => {
        const button = e.target.closest("[data-action]");
        if (button) {
          const url = button.closest("tr").dataset.url;
          if (button.dataset.action === "draft") draftMessage(url, button);
          else track(url, button.dataset.action);
          return;
        }
        const row = e.target.closest("tr.listing-row");
        if (row && !e.target.closest("a")) selectListing(row.dataset.id);
      });
      $("listings-body").addEventListener("mouseover", (e) => {
        const row = e.target.closest("tr.listing-row");
        if (row && row.dataset.id !== hoveredId) setHovered(row.dataset.id);
      });
      $("listings-body").addEventListener("mouseleave", () => setHovered(null));

      $("applied-list").addEventListener("click", (e) => {
        const button = e.target.closest("[data-action]");
        if (!button) return;
        const url = button.closest(".application").dataset.url;
        if (button.dataset.action === "show-message") showMessage(url);
        else track(url, button.dataset.action);
      });

      $("dialog-copy").addEventListener("click", () => {
        navigator.clipboard.writeText($("dialog-body").textContent);
        $("dialog-copy").textContent = "Copied";
      });
      $("message-dialog").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) e.currentTarget.close();
      });

      async function init() {
        try {
          const config = await (await fetch("/api/config")).json();
          target = { ...target, ...config.target };
          if (config.maxPrice) $("f-price").value = config.maxPrice;
          $("f-gender").checked = !config.exclude.genderRestricted;
          $("f-student").checked = !config.exclude.studentHousing;
          $("f-short").checked = !config.exclude.shortSublets;
        } catch {}
        restoreFilters();
        $("legend-target").textContent = target.label;
        initMap();
        loadMessages();
        load();
      }

      init();
    </script>
  </body>
</html>
